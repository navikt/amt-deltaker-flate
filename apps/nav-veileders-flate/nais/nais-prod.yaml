apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: amt-deltaker-flate
  namespace: amt
  labels:
    team: amt
spec:
  image: {{ poaoFrontendImage }}
  port: 8080
  ingresses:
    - https://amt-deltaker-flate.intern.nav.no
  liveness:
    path: /internal/alive
    initialDelay: 10
  readiness:
    path: /internal/ready
    initialDelay: 10
  replicas:
    min: 2
    max: 4
    scalingStrategy:
      cpu:
        thresholdPercentage: 500
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /assets/*
        - /asset-manifest.json
        # Ingen BFF-proxy er konfigurert i prod; dette unntaket ser ubrukt ut.
        - /amt-deltaker-bff/**
  accessPolicy:
    outbound:
      rules:
        # Outbound-regelen trengs hvis poao-frontend proxyer til BFF-en, men finner ingen slik proxy i prod-konfigurasjonen.
        - application: amt-deltaker-bff
  env:
    # Webkomponenten lastes fra CDN; GCS-bøtta brukes ikke til å levere frontend-filer.
    - name: JSON_CONFIG
      value: >
        {
          "fallbackStrategy": "SERVE_INDEX_HTML",
          "gcs": {
            "bucketName": "amt-deltaker-flate-prod"
          },
          "auth": {
            "loginProvider": "AZURE_AD"
          },
          "cors": {
            "origin": [
              "https://veilarbpersonflate.intern.nav.no"
            ]
          }
        }

  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
