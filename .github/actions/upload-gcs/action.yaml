name: Upload frontend assets to GCS
description: Download frontend assets and upload them to a GCS bucket

inputs:
  artifact_name:
    description: Name of the frontend artifact
    required: true
  bucket:
    description: GCS bucket to upload the assets to
    required: true
  workload_identity_provider:
    description: Google Workload Identity Provider
    required: true
  service_account:
    description: Google service account used for the upload
    required: true

runs:
  using: composite
  steps:
    - name: Download frontend assets
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact_name }}
        path: build

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

    - name: Upload files to GCS
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
      run: gsutil -m rsync -r build "$BUCKET"
