name: Cleanup tiltaksarrangor-flate preview

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - eslint.config.mjs
      - .github/actions/**
      - .github/workflows/tiltaksarrangor-flate-*.yaml
      - .github/workflows/reusable-*.yaml

permissions:
  contents: read

concurrency:
  group: tiltaksarrangor-flate-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Delete preview files
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: gsutil -m rm -r "gs://amt-tiltaksarrangor-flate-dev/pr-deltaker-${PR_NUMBER}"
