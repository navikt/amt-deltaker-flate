name: Lint, test og bygg for branch
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Ved delt endring settes pakken til «all», så hele frontend-sjekken kjøres én gang.
      packages: ${{ contains(fromJSON(steps.filter.outputs.changes), 'all') && '["all"]' || steps.filter.outputs.changes }}
      playwright_version: ${{ steps.playwright_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hent Playwright-versjon
        id: playwright_version
        run: |
          version=$(yq -er '.catalog."@playwright/test"' pnpm-workspace.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            innbyggers-flate: apps/innbyggers-flate/**
            nav-veileders-flate: apps/nav-veileders-flate/**
            tiltaksarrangor-flate: apps/tiltaksarrangor-flate/**
            tiltakskoordinator-flate: apps/tiltakskoordinator-flate/**
            # Delte filer påvirker alle appene og utløser lint, tester og bygg for alle.
            all:
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - eslint.config.mjs
              - .github/actions/setup-frontend/**
              - .github/workflows/lint-and-test.yaml
              - .github/workflows/reusable-test-build.yaml

  test-and-build:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: ${{ matrix.package }}
      build: true
      playwright_version: ${{ needs.changes.outputs.playwright_version }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  lint-and-test:
    name: Lint, run tests & build
    # Kontroller resultatet også når byggjobben feiler eller blir hoppet over.
    if: always()
    needs: [changes, test-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kontroller resultater
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          TEST_RESULT: ${{ needs.test-and-build.result }}
        run: |
          # Endringsdeteksjon må lykkes før resultatet kan vurderes.
          if [ "$CHANGES_RESULT" != success ]; then
            echo "Endringsdeteksjonen feilet eller ble avbrutt."
            exit 1
          fi
          # Det er forventet at byggjobben hoppes over når ingen relevante filer er endret.
          if [ "$PACKAGES" = '[]' ] && [ "$TEST_RESULT" = skipped ]; then
            echo "Ingen frontend-endringer."
          elif [ "$TEST_RESULT" != success ]; then
            echo "Tester eller bygg feilet, ble avbrutt eller ble uventet hoppet over."
            exit 1
          fi
