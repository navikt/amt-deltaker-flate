name: Reusable upload frontend assets to GCS

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      bucket:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string
      release_name:
        required: false
        type: string
        default: ''
      release_tag:
        required: false
        type: string
        default: ''
      prerelease:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload ${{ inputs.artifact_name }} to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Upload files to GCS
        env:
          BUCKET: ${{ inputs.bucket }}
        run: gsutil -m rsync -r build "$BUCKET"

  release:
    name: Create ${{ inputs.release_name }}
    if: inputs.release_tag != ''
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ inputs.release_name }}
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
