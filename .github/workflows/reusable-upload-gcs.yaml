name: Gjenbrukbar opplasting av frontend-filer til GCS

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      bucket:
        required: true
        type: string
      preserve_pr_previews:
        required: false
        type: boolean
        default: false
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    name: Last opp ${{ inputs.artifact_name }} til GCS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Last ned frontend-filer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Autentiser mot Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Sett opp Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          skip_install: true

      - name: Vis kandidater til GCS-opprydding (ingen sletting)
        env:
          BUCKET: ${{ inputs.bucket }}
          PRESERVE_PR_PREVIEWS: ${{ inputs.preserve_pr_previews }}
        run: |
          if [ "$PRESERVE_PR_PREVIEWS" = true ]; then
            gsutil -m rsync -r -d -n -x '^pr-[0-9]+/' build "$BUCKET"
          else
            gsutil -m rsync -r -d -n build "$BUCKET"
          fi

      - name: Last opp filer til GCS
        env:
          BUCKET: ${{ inputs.bucket }}
        run: gsutil -m rsync -r build "$BUCKET"
