name: Deploy nav-veileders-flate
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false
  push:
    paths:
      - apps/nav-veileders-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/nav-veileders-flate-deploy.yaml
      - .github/workflows/reusable-test-build.yaml
    branches:
      - main
permissions:
  contents: read
env:
  CI: true
  TZ: Europe/Amsterdam
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: nav-veileders-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","demo","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/nav-veileders-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev-nav-veileders-flate:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    name: Deploy nav-veileders-flate to dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-dev
          path: build
      - name: Upload files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: amt
          source: build
          destination: amt-veileder-flate-dev
          no_cache_paths: amt-veileder-flate-dev/build/asset-manifest.json
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
      - run: echo uploaded file ${{ steps.upload.outputs.uploaded }}

  deploy-demo-nav-veileders-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'demo')
    name: Deploy nav-veileders-flate DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-demo
          path: build
      - uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: amt
          source: build
          source_keep_parent_name: false
          destination: amt-veileder-flate-demo
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-prod-nav-veileders-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    name: Deploy nav-veileders-flate to PROD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-prod
          path: build
      - name: Upload files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: amt
          source: build
          destination: amt-veileder-flate-prod
          no_cache_paths: amt-veileder-flate-prod/build/asset-manifest.json
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
      - run: echo uploaded file ${{ steps.upload.outputs.uploaded }}
