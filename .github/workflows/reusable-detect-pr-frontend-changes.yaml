name: Reusable detect PR frontend changes

on:
  workflow_call:
    inputs:
      app:
        required: false
        type: string
        default: ''
    outputs:
      has-changes:
        value: ${{ jobs.changes.outputs.has-changes }}
      app-configs:
        value: ${{ jobs.changes.outputs.app-configs }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Find changed frontend apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-changes: ${{ steps.metadata.outputs.app-configs != '[]' }}
      app-configs: ${{ steps.metadata.outputs.app-configs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find changed frontend apps
        if: inputs.app == ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            innbyggers-flate:
              - apps/innbyggers-flate/**

            nav-veileders-flate:
              - apps/nav-veileders-flate/**

            tiltakskoordinator-flate:
              - apps/tiltakskoordinator-flate/**

            tiltaksarrangor-flate:
              - apps/tiltaksarrangor-flate/**

            shared:
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/config/preview-apps.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-cleanup.yaml
              - .github/workflows/ci-flate-pr-deploy.yaml
              - .github/workflows/reusable-detect-pr-frontend-changes.yaml

      - name: Add preview configuration
        id: metadata
        env:
          SELECTED_APPS: ${{ inputs.app != '' && format('["{0}"]', inputs.app) || steps.filter.outputs.changes }}
        run: |
          selected_apps=$(jq --compact-output --argjson selected "$SELECTED_APPS" '
            if $selected | index("shared") then keys_unsorted else $selected end
          ' .github/config/preview-apps.json)

          app_configs=$(jq --compact-output --argjson selected "$selected_apps" '
            [
              to_entries[]
              | . as $app
              | select($selected | index($app.key))
              | $app.value + { name: $app.key }
            ]
          ' .github/config/preview-apps.json)

          if [ "$(jq 'length' <<< "$app_configs")" -ne "$(jq 'length' <<< "$selected_apps")" ]; then
            echo "::error::Mangler preview-konfigurasjon for en eller flere apper"
            exit 1
          fi

          echo "app-configs=$app_configs" >> "$GITHUB_OUTPUT"
