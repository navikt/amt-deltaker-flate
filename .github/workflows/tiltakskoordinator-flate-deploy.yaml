name: Deploy tiltakskoordinator-flate
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false
permissions:
  contents: read
env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: tiltakskoordinator-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","demo","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/tiltakskoordinator-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev-tiltakskoordinator-flate:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    concurrency:
      group: tiltakskoordinator-flate-dev
      cancel-in-progress: false
    name: Deploy tiltakskoordinator-flate to DEV
    needs: test-and-lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-cdn.yaml
    with:
      artifact_name: assets-tiltakskoordinator-flate-dev
      destination: amt-tiltakskoordinator-flate-dev
      no_cache_paths: amt-tiltakskoordinator-flate-dev/build/asset-manifest.json
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-demo-tiltakskoordinator-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'demo')
    concurrency:
      group: tiltakskoordinator-flate-demo
      cancel-in-progress: false
    name: Deploy tiltakskoordinator-flate DEMO
    needs: test-and-lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-cdn.yaml
    with:
      artifact_name: assets-tiltakskoordinator-flate-demo
      destination: amt-tiltakskoordinator-flate-demo
      source_keep_parent_name: false
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-prod-tiltakskoordinator-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    concurrency:
      group: tiltakskoordinator-flate-prod
      cancel-in-progress: false
    name: Deploy tiltakskoordinator-flate to PROD
    needs: test-and-lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-cdn.yaml
    with:
      artifact_name: assets-tiltakskoordinator-flate-prod
      destination: amt-tiltakskoordinator-flate-prod
      no_cache_paths: amt-tiltakskoordinator-flate-prod/build/asset-manifest.json
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
