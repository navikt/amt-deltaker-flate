name: Rydd applikasjon for PR

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-cleanup.yaml
      - .github/workflows/ci-flate-pr-deploy.yaml
      - .github/workflows/reusable-detect-pr-frontend-changes.yaml
    types:
      - closed
permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-detect-pr-frontend-changes.yaml

  cleanup-pr-flate:
    needs: changes
    if: >-
      needs.changes.outputs.has-changes == 'true' &&
      github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: Rydd ${{ matrix.app }} for PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Used to authenticate with Google Cloud
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    concurrency:
      group: ${{ matrix.app }}-preview-${{ github.event.number }}
      cancel-in-progress: true

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Delete files on GCS
        env:
          APP_NAME: ${{ matrix.app }}
          GS_PATH: ${{ matrix.app == 'innbyggers-flate' && 'gs://amt-deltaker-innbyggers-flate-dev' || matrix.app == 'nav-veileders-flate' && 'gs://amt-deltaker-flate-dev-v2' || matrix.app == 'tiltakskoordinator-flate' && 'gs://amt-tiltakskoordinator-flate-dev-pr' || 'gs://amt-tiltaksarrangor-flate-dev' }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Kontroller bucket-tilgangen før manglende preview-prefikser håndteres.
          gsutil ls "$GS_PATH" > /dev/null

          destinations=("${GS_PATH}/pr-${PR_NUMBER}")
          if [ "$APP_NAME" = "tiltaksarrangor-flate" ]; then
            destinations+=("${GS_PATH}/pr-deltaker-${PR_NUMBER}")
          fi

          existing=()
          for destination in "${destinations[@]}"; do
            if gsutil ls "${destination}/**" > /dev/null 2>&1; then
              existing+=("$destination")
            fi
          done

          if [ "${#existing[@]}" -gt 0 ]; then
            gsutil -m rm -r "${existing[@]}"
          else
            echo "Ingen preview-filer å slette for ${APP_NAME} PR ${PR_NUMBER}"
          fi
