name: Rydd applikasjon for PR

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-deploy.yaml
    types:
      - closed
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    outputs:
      innbyggers-flate: ${{ steps.filter.outputs['innbyggers-flate'] }}
      nav-veileders-flate: ${{ steps.filter.outputs['nav-veileders-flate'] }}
      tiltakskoordinator-flate: ${{ steps.filter.outputs['tiltakskoordinator-flate'] }}
      tiltaksarrangor-flate: ${{ steps.filter.outputs['tiltaksarrangor-flate'] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            innbyggers-flate:
              - apps/innbyggers-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            nav-veileders-flate:
              - apps/nav-veileders-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            tiltakskoordinator-flate:
              - apps/tiltakskoordinator-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            tiltaksarrangor-flate:
              - apps/tiltaksarrangor-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml

  cleanup-pr-flate:
    needs: changes
    name: Rydd applikasjon for PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Used to authenticate with Google Cloud
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: innbyggers-flate
            gs-path: 'gs://amt-deltaker-innbyggers-flate-dev'
          - name: nav-veileders-flate
            gs-path: 'gs://amt-deltaker-flate-dev-v2'
          - name: tiltakskoordinator-flate
            gs-path: 'gs://amt-tiltakskoordinator-flate-dev-pr'
          - name: tiltaksarrangor-flate
            gs-path: 'gs://amt-tiltaksarrangor-flate-dev'
    concurrency:
      group: ${{ matrix.app.name }}-preview-${{ github.event.number }}
      cancel-in-progress: true

    steps:
      # Rydd bare for appendringer i PR-er fra repoet, ikke for fork-PR-er eller Dependabot.
      - name: Set SHOULD_RUN environment variable
        env:
          CHANGES_OUTPUT: ${{ needs.changes.outputs[matrix.app.name] }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          echo "SHOULD_RUN=false" >> $GITHUB_ENV
          if [ "$CHANGES_OUTPUT" = "true" ] && \
             [ "$IS_FORK" != "true" ] && \
             [ "$PR_USER" != "dependabot[bot]" ]; then
            echo "SHOULD_RUN=true" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        if: env.SHOULD_RUN == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        if: env.SHOULD_RUN == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Delete files on GCS
        if: env.SHOULD_RUN == 'true'
        env:
          APP_NAME: ${{ matrix.app.name }}
          GS_PATH: ${{ matrix.app.gs-path }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Kontroller bucket-tilgangen før manglende preview-prefikser håndteres.
          gsutil ls "$GS_PATH" > /dev/null

          destinations=("${GS_PATH}/pr-${PR_NUMBER}")
          if [ "$APP_NAME" = "tiltaksarrangor-flate" ]; then
            destinations+=("${GS_PATH}/pr-deltaker-${PR_NUMBER}")
          fi

          existing=()
          for destination in "${destinations[@]}"; do
            if gsutil ls "${destination}/**" > /dev/null 2>&1; then
              existing+=("$destination")
            fi
          done

          if [ "${#existing[@]}" -gt 0 ]; then
            gsutil -m rm -r "${existing[@]}"
          else
            echo "Ingen preview-filer å slette for ${APP_NAME} PR ${PR_NUMBER}"
          fi
