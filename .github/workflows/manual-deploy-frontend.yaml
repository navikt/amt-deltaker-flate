name: Deploy frontend manually

on:
  workflow_dispatch:
    inputs:
      app:
        description: Velg app
        required: true
        type: choice
        options:
          - nav-veileders-flate
          - innbyggers-flate
          - tiltakskoordinator-flate
          - tiltaksarrangor-flate
          - Alle apper
      target_environment:
        description: Velg miljø
        required: true
        type: choice
        options:
          - dev
          - demo
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: Valider valg av app og miljø
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avvis ugyldig valg av app og miljø
        if: inputs.target_environment == 'demo' && (inputs.app == 'tiltaksarrangor-flate' || inputs.app == 'Alle apper')
        run: |
          echo "::error::Tiltaksarrangørflaten har ikke demo-deploy. Velg en annen app eller et annet miljø."
          exit 1

      - name: Krev main for demo- og produksjonsdeploy
        if: inputs.target_environment != 'dev' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Demo- og produksjonsdeploy må startes fra main."
          exit 1

  deploy-innbyggers-flate:
    name: Deploy innbyggers-flate
    if: inputs.app == 'innbyggers-flate' || inputs.app == 'Alle apper'
    needs: validate
    uses: ./.github/workflows/innbyggers-flate-deploy.yaml
    with:
      target_environment: ${{ inputs.target_environment }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    permissions:
      contents: read
      id-token: write

  deploy-nav-veileders-flate:
    name: Deploy nav-veileders-flate
    if: inputs.app == 'nav-veileders-flate' || inputs.app == 'Alle apper'
    needs: validate
    uses: ./.github/workflows/nav-veileders-flate-deploy.yaml
    with:
      target_environment: ${{ inputs.target_environment }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    permissions:
      contents: read
      id-token: write

  deploy-tiltakskoordinator-flate:
    name: Deploy tiltakskoordinator-flate
    if: inputs.app == 'tiltakskoordinator-flate' || inputs.app == 'Alle apper'
    needs: validate
    uses: ./.github/workflows/tiltakskoordinator-flate-deploy.yaml
    with:
      target_environment: ${{ inputs.target_environment }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    permissions:
      contents: read
      id-token: write

  deploy-tiltaksarrangor-flate:
    name: Deploy tiltaksarrangor-flate
    if: inputs.app == 'tiltaksarrangor-flate' || inputs.app == 'Alle apper'
    needs: validate
    uses: ./.github/workflows/tiltaksarrangor-flate-deploy.yaml
    with:
      target_environment: ${{ inputs.target_environment }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
    permissions:
      contents: write
      id-token: write
