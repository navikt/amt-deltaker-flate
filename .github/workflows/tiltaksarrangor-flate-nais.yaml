name: Deploy tiltaksarrangor poao-frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/tiltaksarrangor-flate/.nais/nais-*.yaml
      - .github/workflows/tiltaksarrangor-flate-nais.yaml

permissions:
  contents: read

concurrency:
  group: tiltaksarrangor-flate-nais
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/tiltaksarrangor-flate/.nais/nais-dev.yaml

  deploy-prod:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/tiltaksarrangor-flate/.nais/nais-prod.yaml
