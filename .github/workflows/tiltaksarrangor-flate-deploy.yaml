name: Deploy tiltaksarrangor-flate

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/actions/upload-gcs/**
      - .github/workflows/tiltaksarrangor-flate-deploy.yaml
      - .github/workflows/reusable-test-build.yaml

permissions:
  contents: read

env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: tiltaksarrangor-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/tiltaksarrangor-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    concurrency:
      group: tiltaksarrangor-flate-dev
      cancel-in-progress: false
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload frontend assets to GCS
        uses: ./.github/actions/upload-gcs
        with:
          artifact_name: assets-tiltaksarrangor-flate-dev
          bucket: gs://amt-tiltaksarrangor-flate-dev
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com

  deploy-prod:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    concurrency:
      group: tiltaksarrangor-flate-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload frontend assets to GCS
        uses: ./.github/actions/upload-gcs
        with:
          artifact_name: assets-tiltaksarrangor-flate-prod
          bucket: gs://amt-tiltaksarrangor-flate-prod
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-prod-d4dd.iam.gserviceaccount.com
