name: Deploy tiltaksarrangor-flate

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Velg miljø
        required: true
        type: choice
        options:
          - dev
        default: dev
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
  push:
    branches: [main]
    paths:
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/tiltaksarrangor-flate-deploy.yaml
      - .github/workflows/reusable-test-build.yaml

permissions:
  contents: read

concurrency:
  group: tiltaksarrangor-flate-deploy
  cancel-in-progress: false

env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: amt-tiltaksarrangor-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/tiltaksarrangor-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-dev
          path: build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - run: gsutil -m rsync -r build gs://amt-tiltaksarrangor-flate-dev
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Tiltaksarrangor deploy dev
          tag_name: release/tiltaksarrangor-flate/dev@${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true

  deploy-prod:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-build-prod
          path: build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-prod-d4dd.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - run: gsutil -m rsync -r build gs://amt-tiltaksarrangor-flate-prod
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Tiltaksarrangor deploy prod
          tag_name: release/tiltaksarrangor-flate/prod@${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: false
