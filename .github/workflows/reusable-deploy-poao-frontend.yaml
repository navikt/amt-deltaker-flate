name: Gjenbrukbar deploy av Nais poao-frontend
on:
  workflow_call:
    inputs:
      module_path:
        required: true
        type: string

      prod_deploy_enabled:
        required: false
        type: boolean
        default: true

      targets:
        required: false
        type: string
        default: '["dev","prod"]'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    name: Deploy poao-frontend til ${{ matrix.target }} for ${{ inputs.module_path }}
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy app
        if: |
          matrix.target == 'dev' ||
          (matrix.target == 'demo' && github.ref == 'refs/heads/main') ||
          (matrix.target == 'prod' && github.ref == 'refs/heads/main' && inputs.prod_deploy_enabled == true)
        uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # v2
        env:
          CLUSTER: ${{ matrix.target == 'prod' && 'prod-gcp' || 'dev-gcp' }}
          RESOURCE: apps/${{ inputs.module_path }}/nais/nais-${{ matrix.target }}.yaml
          VARS: .nais/poao-frontend.yaml
          PRINT_PAYLOAD: true
