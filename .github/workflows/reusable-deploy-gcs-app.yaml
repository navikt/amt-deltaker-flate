name: Gjenbrukbar deploy av GCS-app

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      playwright_version:
        required: true
        type: string
      target_environment:
        required: true
        type: string
      dev_bucket:
        required: true
        type: string
      prod_bucket:
        required: true
        type: string
      demo_destination:
        required: false
        type: string
        default: ''
      cleanup_dev_assets:
        required: false
        type: boolean
        default: false
    secrets:
      READER_TOKEN:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test og bygg ${{ inputs.package }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: ${{ inputs.package }}
      app_version: ${{ github.sha }}
      playwright_version: ${{ inputs.playwright_version }}
      build_targets: ${{ github.event_name == 'push' && (inputs.demo_destination != '' && '["dev","demo","prod"]' || '["dev","prod"]') || format('["{0}"]', inputs.target_environment) }}
      app_directory: apps/${{ inputs.package }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    name: Deploy ${{ inputs.package }} til dev
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    needs: test-and-build
    concurrency:
      group: ${{ inputs.package }}-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-gcs.yaml
    with:
      artifact_name: assets-${{ inputs.package }}-dev
      bucket: ${{ inputs.dev_bucket }}
      preserve_pr_previews: true
      cleanup_assets: ${{ inputs.cleanup_dev_assets }}
      workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
      service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com

  # Bare innbyggers-flate bruker dette demo-steget i GCS-workflowen; filene lastes opp til CDN.
  # Demo-steget er duplisert i reusable-deploy-cdn-app.yaml for nav-veileders-flate og tiltakskoordinator-flate.
  deploy-demo:
    name: Deploy ${{ inputs.package }} til demo
    if: inputs.demo_destination != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'demo')
    needs: test-and-build
    concurrency:
      group: ${{ inputs.package }}-demo
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-cdn.yaml
    with:
      artifact_name: assets-${{ inputs.package }}-demo
      destination: ${{ inputs.demo_destination }}
      source_keep_parent_name: false
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-prod:
    name: Deploy ${{ inputs.package }} til produksjon
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    needs: test-and-build
    concurrency:
      group: ${{ inputs.package }}-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-gcs.yaml
    with:
      artifact_name: assets-${{ inputs.package }}-prod
      bucket: ${{ inputs.prod_bucket }}
      prod_retention_days: 7
      workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
      service_account: amt-deltaker-flate-gcs@amt-prod-d4dd.iam.gserviceaccount.com
