name: Gjenbrukbar opplasting av frontend-filer til CDN

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      destination:
        required: true
        type: string
      no_cache_paths:
        required: false
        type: string
        default: ''
      source_keep_parent_name:
        required: false
        type: boolean
        default: true
      cleanup_environment:
        required: false
        type: string
        default: ''
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Last opp ${{ inputs.artifact_name }} til CDN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sjekk ut kode for produksjonsopprydding
        if: inputs.cleanup_environment == 'prod'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Last ned frontend-filer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Valider CDN-sti for opprydding
        if: inputs.cleanup_environment != ''
        env:
          DESTINATION: ${{ inputs.destination }}
          CLEANUP_ENVIRONMENT: ${{ inputs.cleanup_environment }}
          KEEP_PARENT: ${{ inputs.source_keep_parent_name }}
        run: |
          if [[ "$KEEP_PARENT" != true ||
                ! "$DESTINATION" =~ ^amt-[a-z0-9-]+-(dev|prod)$ ||
                "$CLEANUP_ENVIRONMENT" != "${BASH_REMATCH[1]}" ]]; then
            echo "::error::Ugyldig CDN-sti for opprydding"
            exit 1
          fi

      - name: Last opp filer til CDN
        uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: amt
          source: build
          source_keep_parent_name: ${{ inputs.source_keep_parent_name }}
          destination: ${{ inputs.destination }}
          no_cache_paths: ${{ inputs.no_cache_paths }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

      - name: Sett opp Google Cloud SDK for opprydding
        if: inputs.cleanup_environment != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          skip_install: true

      - name: Vis foreldede CDN-filer i dev (ingen sletting)
        if: inputs.cleanup_environment == 'dev'
        env:
          DESTINATION: ${{ inputs.destination }}
        run: gsutil -m rsync -r -d -n build/assets "gs://${BUCKET_NAME}/amt/${DESTINATION}/build/assets"

      - name: Vis foreldede CDN-filer i prod (ingen sletting)
        if: inputs.cleanup_environment == 'prod'
        env:
          DESTINATION: ${{ inputs.destination }}
          RETENTION_DAYS: '7'
        run: |
          export BUCKET="gs://${BUCKET_NAME}/amt/${DESTINATION}/build"
          gsutil ls -l "${BUCKET}/assets/**" | node scripts/gcs-prod-asset-candidates.mjs
