name: Deploy all apps to GitHub Pages

on:
  push:
    branches:
      - main

env:
  CI: true
  TZ: Europe/Amsterdam
  VITE_APP_VERSION: ${{ github.sha }}

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: innbyggers-flate
            package: innbyggers-flate
          - app: nav-veileders-flate
            package: nav-veileders-flate
          - app: tiltakskoordinator-flate
            package: tiltakskoordinator-flate
          - app: tiltaksarrangor-flate
            package: amt-tiltaksarrangor-flate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-pages-build.yaml
    with:
      app: ${{ matrix.app }}
      package: ${{ matrix.package }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  build-and-deploy:
    name: Build and deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-innbyggers-flate-demo
          path: github-pages/innbyggers-flate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-nav-veileders-flate-demo
          path: github-pages/nav-veileders-flate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-tiltakskoordinator-flate-demo
          path: github-pages/tiltakskoordinator-flate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-tiltaksarrangor-flate-demo
          path: github-pages/tiltaksarrangor-flate

      - name: Generate index page
        run: node scripts/build-github-pages.ts github-pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github-pages
