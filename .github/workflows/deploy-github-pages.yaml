name: Deploy alle apper til GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/*/.env*
      - apps/*/index.html
      - apps/*/package.json
      - apps/*/postcss.config.js
      - apps/*/public/**
      - apps/*/src/**
      - apps/*/tailwind.config.ts
      - apps/*/tsconfig*.json
      - apps/*/turbo.json
      - apps/*/vite*.ts
      - apps/*/vite*.mts
      - packages/**
      - scripts/*.template.html
      - scripts/build-github-pages.ts
      - scripts/package.json
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/deploy-github-pages.yaml

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Bygg og deploy til GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sett opp frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_auth_token: ${{ secrets.READER_TOKEN }}

      - name: Bygg alle apper
        run: |
          pnpm --filter=innbyggers-flate exec vite build --mode demo --base /amt-deltaker-flate/innbyggers-flate/
          pnpm --filter=nav-veileders-flate exec vite build --mode demo --base /amt-deltaker-flate/nav-veileders-flate/
          pnpm --filter=tiltakskoordinator-flate exec vite build --mode demo --base /amt-deltaker-flate/tiltakskoordinator-flate/
          NODE_ENV=development pnpm --filter=tiltaksarrangor-flate exec vite build --mode demo --base /amt-deltaker-flate/tiltaksarrangor-flate/

      - name: Klargjør innhold for GitHub Pages
        run: |
          mkdir -p github-pages
          cp -r apps/innbyggers-flate/build github-pages/innbyggers-flate
          cp -r apps/nav-veileders-flate/build github-pages/nav-veileders-flate
          cp -r apps/tiltakskoordinator-flate/build github-pages/tiltakskoordinator-flate
          cp -r apps/tiltaksarrangor-flate/build github-pages/tiltaksarrangor-flate

      - name: Generer indeksside
        run: node scripts/build-github-pages.ts github-pages

      - name: Deploy til GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github-pages
