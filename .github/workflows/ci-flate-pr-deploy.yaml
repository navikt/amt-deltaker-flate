name: Deploy Pull Request Branch

on:
  workflow_dispatch:
    inputs:
      app:
        description: App som skal deployes
        type: choice
        required: true
        options:
          - innbyggers-flate
          - nav-veileders-flate
          - tiltakskoordinator-flate
          - tiltaksarrangor-flate
      pr_number:
        description: PR-nummer som previewet tilhører
        type: number
        required: true
  pull_request:
    branches:
      - main
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/config/preview-apps.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-deploy.yaml
      - .github/workflows/reusable-detect-pr-frontend-changes.yaml

permissions:
  contents: read

env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  changes:
    name: Finn apper som skal deployes
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-detect-pr-frontend-changes.yaml
    with:
      app: ${{ inputs.app }}

  deploy-pull-request-branch:
    if: >-
      needs.changes.outputs.has-changes == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    name: Deploy Pull Request Branch - ${{ matrix.app.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.app-configs) }}
    concurrency:
      group: ${{ matrix.app.name }}-preview-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_auth_token: ${{ secrets.READER_TOKEN }}
      - name: Build Pull Request Application
        env:
          PACKAGE: ${{ matrix.app.name }}
          BASE_PREFIX: ${{ matrix.app.buildBasePrefix }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
        run: pnpm build:pull-request --filter="$PACKAGE" -- --base="${BASE_PREFIX}${PR_NUMBER}/"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload files to GCS
        env:
          BUILD_DIRECTORY: apps/${{ matrix.app.name }}/build
          GS_PATH: ${{ matrix.app.previewBucket }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
        run: gsutil -m rsync -r "$BUILD_DIRECTORY" "${GS_PATH}/pr-${PR_NUMBER}"

  create-link:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      needs.changes.outputs.has-changes == 'true' &&
      github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: Opprett testlenke for ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.app-configs) }}
    steps:
      - name: Bygg lenke(r) til test-applikasjon
        id: build-links
        env:
          BASE_URLS: ${{ join(matrix.app.previewUrls, ' ') }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Lag én PR-lenke per baseadresse, og bevar linjeskiftene i stegets output.
          links=()
          for base_url in $BASE_URLS; do
            links+=("${base_url}/pr-${PR_NUMBER}/index.html")
          done
          {
            echo "links<<EOF"
            printf '%s\n' "${links[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Opprett lenke(r) til test-applikasjon
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: |
            Lenke(r) for testing av ${{ matrix.app.name }}:
            ${{ steps.build-links.outputs.links }}
