name: Deploy Pull Request Branch

on:
  workflow_dispatch:
    inputs:
      app:
        description: App som skal deployes
        type: choice
        required: true
        options:
          - innbyggers-flate
          - nav-veileders-flate
          - tiltakskoordinator-flate
          - tiltaksarrangor-flate
      pr_number:
        description: PR-nummer som previewet tilhører
        type: number
        required: true
  pull_request:
    branches:
      - main
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-deploy.yaml

permissions:
  contents: read

env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  changes:
    name: Finn apper som skal deployes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-changes: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.changes != '[]' }}
      apps: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            innbyggers-flate:
              - apps/innbyggers-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml

            nav-veileders-flate:
              - apps/nav-veileders-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml

            tiltakskoordinator-flate:
              - apps/tiltakskoordinator-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml

            tiltaksarrangor-flate:
              - apps/tiltaksarrangor-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
  playwright-version:
    name: Get playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fjern ^ eller ~ fra pnpm-versjonen før den brukes som Docker-image-tag.
      - id: get-version
        run: echo "version=$(yq -r '.catalog.playwright' pnpm-workspace.yaml | sed -e 's/^[\^\~]//')" >> "$GITHUB_OUTPUT"

  deploy-pull-request-branch:
    if: >-
      needs.changes.outputs.has-changes == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    name: Deploy Pull Request Branch - ${{ matrix.app }}
    needs:
      - changes
      - playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    concurrency:
      group: ${{ matrix.app }}-preview-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
      cancel-in-progress: true
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_auth_token: ${{ secrets.READER_TOKEN }}
      - name: Build Pull Request Application
        env:
          PACKAGE: ${{ matrix.app }}
          BASE_PREFIX: ${{ matrix.app == 'innbyggers-flate' && '/arbeidsmarkedstiltak/pr-' || matrix.app == 'tiltaksarrangor-flate' && '/deltakeroversikt/pr-' || '/pr-' }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
        run: pnpm build:pull-request --filter="$PACKAGE" -- --base="${BASE_PREFIX}${PR_NUMBER}/"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload files to GCS
        env:
          BUILD_DIRECTORY: apps/${{ matrix.app }}/build
          GS_PATH: ${{ matrix.app == 'innbyggers-flate' && 'gs://amt-deltaker-innbyggers-flate-dev' || matrix.app == 'nav-veileders-flate' && 'gs://amt-deltaker-flate-dev-v2' || matrix.app == 'tiltakskoordinator-flate' && 'gs://amt-tiltakskoordinator-flate-dev-pr' || 'gs://amt-tiltaksarrangor-flate-dev' }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.number }}
        run: gsutil -m rsync -r "$BUILD_DIRECTORY" "${GS_PATH}/pr-${PR_NUMBER}"
