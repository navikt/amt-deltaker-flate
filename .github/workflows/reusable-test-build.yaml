name: Gjenbrukbar test og bygg av frontend

on:
  workflow_call:
    inputs:
      package:
        type: string
        default: all
      build:
        type: boolean
        default: false
      app_version:
        type: string
        default: ''
      build_targets:
        type: string
        default: '[]'
      app_directory:
        type: string
        default: ''
      playwright_version:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true

permissions:
  contents: read

env:
  CI: true
  TZ: Europe/Oslo

jobs:
  test-and-build:
    name: Test og bygg ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright_version }}-jammy
    env:
      APP_DIRECTORY: ${{ inputs.app_directory }}
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mellomlagre Turbo-resultater
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ inputs.package }}-${{ inputs.playwright_version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ inputs.package }}-${{ inputs.playwright_version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json') }}-
      - name: Sett appversjon
        if: inputs.app_version != ''
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: echo "VITE_APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Sett opp frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_auth_token: ${{ secrets.READER_TOKEN }}
      - name: Kjør lint
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = all ]; then
            pnpm lint
          else
            pnpm lint --filter="$PACKAGE..."
          fi
      - name: Kjør tester
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = all ]; then
            pnpm test:no-watch
          else
            pnpm test:no-watch --filter="$PACKAGE"
          fi
      - name: Kjør Playwright-tester
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = all ]; then
            pnpm playwright
          else
            pnpm playwright --filter="$PACKAGE"
          fi
      - name: Valider app-mappe for miljøbygg
        if: >-
          contains(fromJSON(inputs.build_targets), 'dev') ||
          contains(fromJSON(inputs.build_targets), 'demo') ||
          contains(fromJSON(inputs.build_targets), 'prod')
        run: |
          if [[ ! "$APP_DIRECTORY" =~ ^apps/[a-z0-9-]+$ ]]; then
            echo "::error::Ugyldig app_directory for bygg"
            exit 1
          fi
      - name: Bygg dev
        if: contains(fromJSON(inputs.build_targets), 'dev')
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          rm -rf -- "$APP_DIRECTORY/build"
          pnpm build:dev --filter="$PACKAGE"
      - name: Last opp dev-filer
        if: contains(fromJSON(inputs.build_targets), 'dev')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: assets-${{ inputs.package }}-dev
          path: ${{ inputs.app_directory }}/build
          if-no-files-found: error
          retention-days: 1
      - name: Bygg demo
        if: contains(fromJSON(inputs.build_targets), 'demo')
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          rm -rf -- "$APP_DIRECTORY/build"
          pnpm build:demo --filter="$PACKAGE"
      - name: Last opp demo-filer
        if: contains(fromJSON(inputs.build_targets), 'demo')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: assets-${{ inputs.package }}-demo
          path: ${{ inputs.app_directory }}/build
          if-no-files-found: error
          retention-days: 1
      - name: Bygg produksjon
        if: contains(fromJSON(inputs.build_targets), 'prod')
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          rm -rf -- "$APP_DIRECTORY/build"
          pnpm build --filter="$PACKAGE"
      - name: Last opp produksjonsfiler
        if: contains(fromJSON(inputs.build_targets), 'prod')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: assets-${{ inputs.package }}-prod
          path: ${{ inputs.app_directory }}/build
          if-no-files-found: error
          retention-days: 1
      - name: Bygg
        if: inputs.build
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = all ]; then
            pnpm build
          else
            pnpm build --filter="$PACKAGE"
          fi
      - name: Last opp Playwright-rapporter
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-${{ inputs.package }}
          path: |
            apps/*/playwright-report
            apps/*/test-results
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 7
