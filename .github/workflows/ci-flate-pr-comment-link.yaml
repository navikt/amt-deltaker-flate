name: Opprett lenke til test-applikasjon for PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-deploy.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    outputs:
      innbyggers-flate: ${{ steps.filter.outputs['innbyggers-flate'] }}
      nav-veileders-flate: ${{ steps.filter.outputs['nav-veileders-flate'] }}
      tiltakskoordinator-flate: ${{ steps.filter.outputs['tiltakskoordinator-flate'] }}
      tiltaksarrangor-flate: ${{ steps.filter.outputs['tiltaksarrangor-flate'] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            innbyggers-flate: 
              - apps/innbyggers-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            nav-veileders-flate: 
              - apps/nav-veileders-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            tiltakskoordinator-flate: 
              - apps/tiltakskoordinator-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml
            tiltaksarrangor-flate:
              - apps/tiltaksarrangor-flate/**
              - packages/**
              - shared-config/**
              - .npmrc
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.json
              - .github/actions/setup-frontend/**
              - .github/workflows/ci-flate-pr-deploy.yaml

  create-link:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    strategy:
      matrix:
        app:
          - name: innbyggers-flate
            lenker:
              - 'https://amt.intern.dev.nav.no/arbeidsmarkedstiltak'
          - name: nav-veileders-flate
            lenker:
              - 'https://amt-deltaker-flate.intern.dev.nav.no'
              - 'https://amt-deltaker-flate.ansatt.dev.nav.no'
          - name: tiltakskoordinator-flate
            lenker:
              - 'https://amt-tiltakskoordinator-flate.intern.dev.nav.no'
              - 'https://amt-tiltakskoordinator-flate.ansatt.dev.nav.no'
          - name: tiltaksarrangor-flate
            lenker:
              - 'https://amt.intern.dev.nav.no/deltakeroversikt'
              - 'https://amt.ansatt.dev.nav.no/deltakeroversikt'

    steps:
      - name: Bygg lenke(r) til test-applikasjon
        id: build-links
        run: |
          # Lag én PR-lenke per baseadresse, og bevar linjeskiftene i stegets output.
          links=()
          for base in ${{ join(matrix.app.lenker, ' ') }}; do
            links+=("${base}/pr-${{ github.event.number }}/index.html")
          done
          {
            echo "links<<EOF"
            printf '%s\n' "${links[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Opprett lenke(r) til test-applikasjon
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        # Ikke skriv testlenker for fork-PR-er eller Dependabot.
        if: needs.changes.outputs[matrix.app.name] == 'true' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          message: |
            Lenke(r) for testing av ${{ matrix.app.name }}:
            ${{ steps.build-links.outputs.links }}
