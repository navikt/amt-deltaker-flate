name: Opprett lenke til test-applikasjon for PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - apps/innbyggers-flate/**
      - apps/nav-veileders-flate/**
      - apps/tiltakskoordinator-flate/**
      - apps/tiltaksarrangor-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/ci-flate-pr-deploy.yaml
      - .github/workflows/reusable-detect-pr-frontend-changes.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-detect-pr-frontend-changes.yaml

  create-link:
    needs: changes
    if: >-
      needs.changes.outputs.has-changes == 'true' &&
      github.event.pull_request.head.repo.fork != true &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: Opprett testlenke for ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    steps:
      - name: Bygg lenke(r) til test-applikasjon
        id: build-links
        env:
          APP_NAME: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          case "$APP_NAME" in
            innbyggers-flate)
              base_urls=("https://amt.intern.dev.nav.no/arbeidsmarkedstiltak")
              ;;
            nav-veileders-flate)
              base_urls=(
                "https://amt-deltaker-flate.intern.dev.nav.no"
                "https://amt-deltaker-flate.ansatt.dev.nav.no"
              )
              ;;
            tiltakskoordinator-flate)
              base_urls=(
                "https://amt-tiltakskoordinator-flate.intern.dev.nav.no"
                "https://amt-tiltakskoordinator-flate.ansatt.dev.nav.no"
              )
              ;;
            tiltaksarrangor-flate)
              base_urls=(
                "https://amt.intern.dev.nav.no/deltakeroversikt"
                "https://amt.ansatt.dev.nav.no/deltakeroversikt"
              )
              ;;
            *)
              echo "::error::Ukjent app: $APP_NAME"
              exit 1
              ;;
          esac

          # Lag én PR-lenke per baseadresse, og bevar linjeskiftene i stegets output.
          links=()
          for base_url in "${base_urls[@]}"; do
            links+=("${base_url}/pr-${PR_NUMBER}/index.html")
          done
          {
            echo "links<<EOF"
            printf '%s\n' "${links[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Opprett lenke(r) til test-applikasjon
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: |
            Lenke(r) for testing av ${{ matrix.app }}:
            ${{ steps.build-links.outputs.links }}
