name: Deploy innbyggers-flate
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false
  push:
    paths:
      - apps/innbyggers-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/actions/upload-gcs/**
      - .github/workflows/innbyggers-flate-deploy.yaml
      - .github/workflows/reusable-test-build.yaml
      - .github/workflows/reusable-upload-cdn.yaml
    branches:
      - main
permissions:
  contents: read
env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: innbyggers-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","demo","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/innbyggers-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev-innbyggers-flate:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    concurrency:
      group: innbyggers-flate-dev
      cancel-in-progress: false
    name: Deploy innbyggers-flate to DEV
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload frontend assets to GCS
        uses: ./.github/actions/upload-gcs
        with:
          artifact_name: assets-innbyggers-flate-dev
          bucket: gs://amt-deltaker-innbyggers-flate-dev
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com

  deploy-demo-innbyggers-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'demo')
    concurrency:
      group: innbyggers-flate-demo
      cancel-in-progress: false
    name: Deploy innbyggers-flate DEMO
    needs: test-and-lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-upload-cdn.yaml
    with:
      artifact_name: assets-innbyggers-flate-demo
      destination: amt-innbygger-flate-demo
      source_keep_parent_name: false
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-prod-innbyggers-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    concurrency:
      group: innbyggers-flate-prod
      cancel-in-progress: false
    name: Deploy innbyggers-flate to PROD
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload frontend assets to GCS
        uses: ./.github/actions/upload-gcs
        with:
          artifact_name: assets-innbyggers-flate-prod
          bucket: gs://amt-deltaker-innbyggers-flate-prod
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-prod-d4dd.iam.gserviceaccount.com
