name: Deploy innbyggers-flate
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
    secrets:
      READER_TOKEN:
        required: true
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false
  push:
    paths:
      - apps/innbyggers-flate/**
      - packages/**
      - shared-config/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - .github/actions/setup-frontend/**
      - .github/workflows/innbyggers-flate-deploy.yaml
      - .github/workflows/reusable-test-build.yaml
    branches:
      - main
permissions:
  contents: read
env:
  CI: true
  TZ: Europe/Oslo
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  test-and-lint:
    name: Test and lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test-build.yaml
    with:
      package: innbyggers-flate
      app-version: ${{ github.sha }}
      build-targets: ${{ github.event_name == 'push' && '["dev","demo","prod"]' || format('["{0}"]', inputs.target_environment) }}
      app-directory: apps/innbyggers-flate
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev-innbyggers-flate:
    if: github.event_name == 'push' || inputs.target_environment == 'dev'
    concurrency:
      group: innbyggers-flate-dev
      cancel-in-progress: false
    name: Deploy innbyggers-flate to DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: assets-innbyggers-flate-dev
          path: build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/696882554390/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-dev-d98f.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload files to GCS
        run: gsutil -m rsync -r build gs://amt-deltaker-innbyggers-flate-dev

  deploy-demo-innbyggers-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'demo')
    concurrency:
      group: innbyggers-flate-demo
      cancel-in-progress: false
    name: Deploy innbyggers-flate DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: assets-innbyggers-flate-demo
          path: build
      - uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: amt
          source: build
          source_keep_parent_name: false
          destination: amt-innbygger-flate-demo
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

  deploy-prod-innbyggers-flate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target_environment == 'prod')
    concurrency:
      group: innbyggers-flate-prod
      cancel-in-progress: false
    name: Deploy innbyggers-flate to PROD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-lint
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: assets-innbyggers-flate-prod
          path: build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/337368476147/locations/global/workloadIdentityPools/github/providers/github-action
          service_account: amt-deltaker-flate-gcs@amt-prod-d4dd.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Upload files to GCS
        run: gsutil -m rsync -r build gs://amt-deltaker-innbyggers-flate-prod
