packages:
  - apps/*
  - shared-config/*
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  msw: true
  protobufjs: false

# Sentralisert versjonshåndtering - referer med "catalog:" i package.json
catalog:
  '@nais/apm': 0.7.3
  '@axe-core/playwright': ^4.14.0
  '@eslint/js': ^10.0.1
  '@faker-js/faker': ^10.6.0
  '@grafana/faro-react': ^2.14.0
  '@grafana/faro-web-sdk': ^2.14.0
  '@navikt/aksel-icons': ^8.23.0
  '@navikt/ds-css': ^8.23.0
  '@navikt/ds-react': ^8.23.0
  '@navikt/ds-tailwind': ^8.23.0
  '@navikt/nav-dekoratoren-moduler': ^4.6.0
  # Eksakt versjon må samsvare med Playwright-imaget i reusable-test-build.yaml.
  '@playwright/test': 1.65.1
  '@tailwindcss/postcss': 4.3.5
  '@tailwindcss/vite': ^4.3.5
  '@tanstack/react-query': ^5.108.0
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.13
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  '@vitejs/plugin-react-swc': ^4.3.3
  dayjs: ^1.11.23
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-jsx-a11y: ^6.10.2
  globals: ^17.14.0
  husky: ^9.1.7
  jsdom: ^31.0.1
  lint-staged: ^17.6.1
  msw: ^3.0.7
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.18.6
  tailwindcss: ^4.3.5
  typescript: ^6.0.3
  typescript-eslint: ^8.73.0
  uuid: ^14.0.3
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7

overrides:
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'

# Pakker må være 7 dager gamle før de kan installeres (likt som dependabot cooldown)
# Et sikkerhetstiltak i tilfelle en pakke blir komprimittert
minimumReleaseAge: 10080 # 24 x 60 x 7

# Unntak for manuelt oppdaterte pakker innenfor minimumReleaseAge
minimumReleaseAgeExclude: []
