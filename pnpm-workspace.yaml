packages:
  - apps/*
  - shared-config/*
  - packages/*

allowBuilds:
  '@swc/core': false
  esbuild: true
  msw: true
  protobufjs: false

# Sentralisert versjonshåndtering - referer med "catalog:" i package.json
catalog:
  '@axe-core/playwright': ^4.13.0
  '@grafana/faro-react': ^2.12.1
  '@grafana/faro-web-sdk': ^2.12.1
  '@navikt/aksel-icons': ^8.19.2
  '@navikt/ds-css': ^8.19.2
  '@navikt/ds-react': ^8.19.2
  '@navikt/ds-tailwind': ^8.19.2
  '@playwright/test': ^1.64.1
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.2
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react-swc': ^4.3.3
  dayjs: ^1.11.23
  jsdom: ^30.1.2
  msw: ^3.0.3
  playwright: ^1.64.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router-dom: ^7.18.4
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  uuid: ^14.0.3
  vite: ^8.3.4
  vitest: ^5.0.4
  zod: ^4.6.7

overrides:
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'

# Pakker må være 7 dager gamle før de kan installeres (likt som dependabot cooldown)
# Et sikkerhetstiltak i tilfelle en pakke blir komprimittert
minimumReleaseAge: 10080 # 24 x 60 x 7

# Unntak for manuelt oppdaterte pakker innenfor minimumReleaseAge
minimumReleaseAgeExclude: []
